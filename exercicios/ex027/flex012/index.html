<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexible Box</title>
    <style>
        /*
        Flex: 0 1 auto ou Flex: initial
        Flex: 0 0 auto ou Flex: none
        Flex: 1 1 auto ou Flex: auto
        Flex: 3 ou Flex: 3 1 auto 
        */
        div.container {
            background-color: lightsalmon;
            display: flex;
            flex-flow: row nowrap;
        }

        div.item {
            background-color: lightblue;
            border: 1px solid black;
            text-align: center;
        }

        div.item:hover {
            background-color: blueviolet;
            transition: .5s;
        }

        div#cxA {
           /* flex-shrink: 0;
           flex-grow: 1; 
           flex-basis: 200px; */

           flex: 1 0 200px;
        }

        div#cxB {
            /* flex-shrink: 0;
            flex-grow: 1;
            flex-basis: 150px; */

            flex: 1 1 150px;
        }

        div#cxC {
           /* flex-shrink: 0;
           flex-grow: 1;
           flex-basis: auto; */

           flex: 1 8 auto;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="item" id="cxA">A</div>
        <div class="item" id="cxB">B</div>
        <div class="item" id="cxC">C</div>
    </div>
</body>
</html>
